batch_size: 4
bnb_config: null
convert_labels_to_int: true
dataset_config: nl
dataset_name: alexandrainst/m_arc
dataset_split: test
device: auto
f1_average: macro
label_column: answer
labels2idx:
  A: 0
  B: 1
  C: 2
  D: 3
model_kwargs:
  torch_dtype: auto
model_name: mistralai/Mistral-7B-v0.3
num_workers: 36
output_dir: results/benchmarks/arc/mistral-7b-v03
prompt: "{{- instruction }}\n\n{% set options = [\n  ('A', option_a),\n  ('B', option_b),\n\
  \  ('C', option_c),\n  ('D', option_d)\n] -%}\n{%- set available_options = options\
  \ | selectattr('1', 'defined') | rejectattr('1', 'none') | list -%}\n{%- if available_options\
  \ -%}\nAntwoordopties:\n{%- for letter, option in available_options %}\n{{ letter\
  \ }}. {{ option }}\n{%- endfor %}\n\nAntwoord met {% for i in range(available_options|length)\
  \ -%}\n'{{ available_options[i][0] }}'{% if i + 2 == available_options|length %}\
  \ of {% elif i + 1 < available_options|length %}, {% endif %}\n{%- endfor -%}.\n\
  {%- endif -%}\n"
use_chat_template: false
